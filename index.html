<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- Ponte temporária: a página do evento mora em /destrave/, e este
       arquivo existe só pra quem chegar pela raiz com um link antigo.
       Some no dia em que o site principal da RMA ocupar a raiz.

       O destino é relativo de propósito. Um "/destrave/" absoluto
       funcionaria na Hostinger e entraria em laço no GitHub Pages, onde
       a raiz publicada já é /destrave/. -->
  <meta http-equiv="refresh" content="0; url=destrave/">
  <link rel="canonical" href="https://rmaeducacao.com.br/destrave/">
  <meta name="robots" content="noindex, follow">

  <title>Destrave sua Comunicação</title>

  <style>
    :root { color-scheme: dark; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 2rem;
      background: #120309;
      color: #f6efec;
      font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
      line-height: 1.6;
      text-align: center;
    }
    a { color: #e8402c; }
  </style>
</head>
<body>
  <p>
    A página do Destrave mudou de endereço.<br>
    <a href="destrave/">Ir para a página do evento</a>
  </p>

  <script>
    /* Leva a query adiante: um anúncio que aponte pra raiz perderia as
       UTMs no salto, e o lead chegaria no Make sem origem.
       Substitui em vez de empilhar, senão o botão voltar cai aqui de
       novo e devolve a pessoa pra frente num laço. */
    location.replace('destrave/' + location.search + location.hash);
  </script>
</body>
</html>
